model_parameters:
  onnx_model: /absolute/path/model.onnx
  march: bernoulli2
  working_dir: /absolute/path/model_output
  output_model_file_prefix: sap
  layer_out_dump: false
input_parameters:
  input_name: images
  input_type_rt: featuremap
  input_layout_rt: NCHW
  input_type_train: featuremap
  input_layout_train: NCHW
  input_shape: 1x3x640x640
  norm_type: no_preprocess
calibration_parameters:
  cal_data_dir: /absolute/path/calibration
  cal_data_type: float32
  calibration_type: max
compiler_parameters:
  compile_mode: latency
  debug: true
  optimize_level: O2
